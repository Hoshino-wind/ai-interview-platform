version: '3.8'
services:
  postgres:
    image: postgres:16
    container_name: smartview-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: smartview
      POSTGRES_PASSWORD: smartview123
      POSTGRES_DB: smartview
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: smartview-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/var/lib/redis/data

volumes:
  postgres_data:
  redis_data:
